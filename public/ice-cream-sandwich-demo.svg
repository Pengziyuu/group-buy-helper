<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">超厚三明治冰餅口味示意圖</title>
  <desc id="desc">九種不同顏色冰淇淋夾在金黃色餅乾中的商品示意插畫</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9ed"/><stop offset="1" stop-color="#dcedf2"/></linearGradient>
    <linearGradient id="cookie" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#efc57d"/><stop offset="1" stop-color="#bd7937"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#173a44" flood-opacity=".18"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="2.5" fill="#8f5728" opacity=".45"/><circle cx="21" cy="20" r="2" fill="#8f5728" opacity=".35"/></pattern>
  </defs>
  <rect width="1200" height="720" rx="44" fill="url(#bg)"/>
  <circle cx="1040" cy="125" r="150" fill="#fff" opacity=".45"/>
  <circle cx="130" cy="650" r="210" fill="#b9dde6" opacity=".35"/>
  <g transform="translate(126 92)" filter="url(#shadow)">
    <g transform="translate(0 0)"><rect width="285" height="100" rx="28" fill="url(#cookie)"/><rect y="78" width="285" height="92" rx="25" fill="#f3f0dc"/><rect y="148" width="285" height="100" rx="28" fill="url(#cookie)"/><rect width="285" height="248" rx="28" fill="url(#dots)" opacity=".42"/></g>
    <g transform="translate(330 0)"><rect width="285" height="100" rx="28" fill="url(#cookie)"/><rect y="78" width="285" height="92" rx="25" fill="#d7a96d"/><rect y="148" width="285" height="100" rx="28" fill="url(#cookie)"/><rect width="285" height="248" rx="28" fill="url(#dots)" opacity=".42"/></g>
    <g transform="translate(660 0)"><rect width="285" height="100" rx="28" fill="url(#cookie)"/><rect y="78" width="285" height="92" rx="25" fill="#8ca56d"/><rect y="148" width="285" height="100" rx="28" fill="url(#cookie)"/><rect width="285" height="248" rx="28" fill="url(#dots)" opacity=".42"/></g>
    <g transform="translate(0 300)"><rect width="285" height="100" rx="28" fill="url(#cookie)"/><rect y="78" width="285" height="92" rx="25" fill="#efa6ad"/><rect y="148" width="285" height="100" rx="28" fill="url(#cookie)"/><rect width="285" height="248" rx="28" fill="url(#dots)" opacity=".42"/></g>
    <g transform="translate(330 300)"><rect width="285" height="100" rx="28" fill="url(#cookie)"/><rect y="78" width="285" height="92" rx="25" fill="#735247"/><rect y="148" width="285" height="100" rx="28" fill="url(#cookie)"/><rect width="285" height="248" rx="28" fill="url(#dots)" opacity=".42"/></g>
    <g transform="translate(660 300)"><rect width="285" height="100" rx="28" fill="url(#cookie)"/><rect y="78" width="285" height="92" rx="25" fill="#565058"/><rect y="148" width="285" height="100" rx="28" fill="url(#cookie)"/><rect width="285" height="248" rx="28" fill="url(#dots)" opacity=".42"/></g>
  </g>
  <g font-family="system-ui, sans-serif" fill="#173a44"><text x="600" y="674" text-anchor="middle" font-size="28" font-weight="700">九種口味・商品示意圖</text></g>
</svg>
